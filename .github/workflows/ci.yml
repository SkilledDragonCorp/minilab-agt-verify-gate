name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  lab:
    name: lab
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync
        run: uv sync --frozen --group dev

      - name: Reference CI hash
        run: |
          bash scripts/fetch-upstream-ci.sh
          uv run pytest tests/test_reference_ci_hash.py -v --tb=short

      - name: agt doctor
        run: |
          uv run agt doctor
          uv run pytest tests/test_agt_doctor.py -v --tb=short

      - name: Ruff
        run: uv run ruff check .

      - name: pip-audit
        # cryptography 48.x advisories: AGT 4.1.0 caps cryptography<49 (upstream pin).
        run: |
          uv run pip-audit \
            --ignore-vuln PYSEC-2026-3552 \
            --ignore-vuln PYSEC-2026-3553 \
            --ignore-vuln PYSEC-2026-3554

      - name: Skills layout / frontmatter
        run: |
          test ! -e .cursor/skills && test ! -e .agents/skills
          python3 scripts/check-skills

  upstream-parity:
    name: upstream-parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync lab (agt on PATH for doctor oracle only)
        run: uv sync --frozen --group dev

      - name: Keyless agent-os parity
        run: |
          # Ensure pip/pytest target the uv environment for editable sibling installs.
          source .venv/bin/activate
          bash scripts/run-keyless-parity.sh
        env:
          DO_NOT_TRACK: "1"
          DISABLE_TELEMETRY: "1"

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks v8.30.1
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose --no-banner --config .gitleaks.toml

      - name: osv-scanner v2.7.0
        run: |
          set -euo pipefail
          OSV_VERSION=2.7.0
          OSV_SHA256=160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
          curl -fsSL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan --config osv-scanner.toml --lockfile uv.lock

      - name: No forbidden skill mirrors
        run: test ! -e .cursor/skills && test ! -e .agents/skills
